name: RDP Hardware Runner

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      # =====================================================
      # 1) HARDWARE REPORT
      # =====================================================
      - name: Show System Hardware and Storage
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       RDP SYSTEM HARDWARE REPORT"
          Write-Host "=========================================="

          # ---------- CPU ----------
          Write-Host ""
          Write-Host "--- CPU DETAILS ---"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors |
            Format-List |
            Out-String |
            Write-Host

          # ---------- RAM ----------
          $os  = Get-CimInstance Win32_OperatingSystem
          $ram = Get-CimInstance Win32_ComputerSystem

          $totalRamGB = $ram.TotalPhysicalMemory / 1GB
          $freeRamGB  = $os.FreePhysicalMemory / 1MB
          $usedRamGB  = $totalRamGB - $freeRamGB

          if ($totalRamGB -gt 0) {
            $ramUsedPercent = ($usedRamGB / $totalRamGB) * 100
          }
          else {
            $ramUsedPercent = 0
          }

          Write-Host ""
          Write-Host "--- RAM DETAILS ---"
          Write-Host ("Total RAM     : {0:N2} GB" -f $totalRamGB)
          Write-Host ("Used RAM      : {0:N2} GB ({1:N1}%)" -f $usedRamGB, $ramUsedPercent)
          Write-Host ("Available RAM : {0:N2} GB" -f $freeRamGB)

          # ---------- SYSTEM ----------
          Write-Host ""
          Write-Host "--- SYSTEM DETAILS ---"
          Write-Host ("Computer     : " + $env:COMPUTERNAME)
          Write-Host ("Windows      : " + $os.Caption)
          Write-Host ("Version      : " + $os.Version)
          Write-Host ("Architecture : " + $env:PROCESSOR_ARCHITECTURE)

          # ---------- STORAGE ----------
          Write-Host ""
          Write-Host "--- STORAGE / DISKS ---"

          $disks = Get-CimInstance Win32_LogicalDisk | Where-Object { $_.DriveType -eq 3 }

          foreach ($disk in $disks) {
            $total = $disk.Size / 1GB
            $free  = $disk.FreeSpace / 1GB
            $used  = $total - $free

            if ($total -gt 0) {
              $percent = ($used / $total) * 100
            }
            else {
              $percent = 0
            }

            Write-Host ""
            Write-Host ("Drive: " + $disk.DeviceID)
            Write-Host ("Total: {0:N2} GB" -f $total)
            Write-Host ("Used : {0:N2} GB ({1:N1}%)" -f $used, $percent)
            Write-Host ("Free : {0:N2} GB" -f $free)
            Write-Host "------------------------------"
          }

          # ---------- GPU ----------
          Write-Host ""
          Write-Host "--- GPU DETAILS ---"

          $gpus = Get-CimInstance Win32_VideoController

          foreach ($gpu in $gpus) {
            if ($null -ne $gpu.AdapterRAM -and $gpu.AdapterRAM -gt 0) {
              $vram = [math]::Round($gpu.AdapterRAM / 1GB, 2)
            }
            else {
              $vram = "Unknown"
            }

            Write-Host ("Name    : " + $gpu.Name)
            Write-Host ("VRAM_GB : " + $vram)
            Write-Host ""
          }

          Write-Host "=========================================="
          Write-Host "       HARDWARE REPORT COMPLETE"
          Write-Host "   Report Generated By: Irfan Ali"
          Write-Host "=========================================="

      # =====================================================
      # 2) RDP SETUP
      # =====================================================
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          # Enable Remote Desktop and disable Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          # Remove old rule (if any) to avoid duplicates
          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          # Allow RDP only from the Tailscale network (100.64.0.0/10)
          netsh advfirewall firewall add rule name="RDP-Tailscale" `
            dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        shell: pwsh
        run: |
          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = [char[]]"!@#%^&*()-_=+"
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 4
          $rawPassword += $charSet.Lower   | Get-Random -Count 4
          $rawPassword += $charSet.Number  | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password   = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          if (-not (Get-LocalUser -Name "RDP")) {
            Write-Error "User creation failed"
            exit 1
          }

          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl         = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        shell: pwsh
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="gh-runner-$env:GITHUB_RUN_ID"

          # Wait for Tailscale to assign an IP
          $tsIP    = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 10) {
            $tsIP = & $ts ip -4
            if (-not $tsIP) {
              Start-Sleep -Seconds 5
            }
            $retries++
          }

          if (-not $tsIP) {
            Write-Error "Tailscale IP not assigned. Exiting."
            exit 1
          }

          "TAILSCALE_IP=$tsIP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed"
            exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "=================="
          Write-Host ""

          # Keep runner active until timeout or manual cancel
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - cancel the workflow to stop"
            Start-Sleep -Seconds 300
          }
