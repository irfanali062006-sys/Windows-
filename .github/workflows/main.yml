name: RDP Hardware Runner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show System Hardware and Storage
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       RDP SYSTEM HARDWARE REPORT"
          Write-Host "=========================================="

          # CPU Details
          $cpu = Get-CimInstance Win32_Processor
          Write-Host "`n--- CPU DETAILS ---"
          $cpu | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List | Out-String | Write-Host

          # RAM Details
          $os = Get-CimInstance Win32_OperatingSystem
          $ram = Get-CimInstance Win32_ComputerSystem$totalRamGB = $ram.TotalPhysicalMemory / 1GB$freeRamGB = $os.FreePhysicalMemory / 1MB$usedRamGB = $totalRamGB -$freeRamGB
          $ramUsedPercent = if ($totalRamGB -gt 0) { ($usedRamGB / $totalRamGB) * 100 } else { 0 }

          Write-Host "--- RAM DETAILS ---"
          Write-Host ("Total RAM     : {0:N2} GB" -f $totalRamGB)
          Write-Host ("Used RAM      : {0:N2} GB ({1:N1}%)" -f $usedRamGB,$ramUsedPercent)
          Write-Host ("Available RAM : {0:N2} GB" -f $freeRamGB)

          # System Details
          Write-Host "`n--- SYSTEM DETAILS ---"
          Write-Host "Computer    : $env:COMPUTERNAME"
          Write-Host "Windows     : $($os.Caption)"
          Write-Host "Version     : $($os.Version)"
          Write-Host "Architecture: $env:PROCESSOR_ARCHITECTURE"

          # Storage / Disks
          Write-Host "`n--- STORAGE / DISKS ---"
          Get-CimInstance Win32_LogicalDisk | Where-Object { $_.DriveType -eq 3 } \vert{} ForEach-Object {$total = $_.Size / 1GB$free = $_.FreeSpace / 1GB$used = $total -$free
              $percent = if ($total -gt 0) {
                ($used / $total) * 100
              } else { 0 }

              Write-Host "Drive: $($_.DeviceID)"
              Write-Host ("Total: {0:N2} GB" -f $total)
              Write-Host ("Used : {0:N2} GB ({1:N1}%)" -f $used,$percent)
              Write-Host ("Free : {0:N2} GB" -f $free)
              Write-Host "------------------------------"
          }

          # GPU Details
          Write-Host "`n--- GPU DETAILS ---"
          Get-CimInstance Win32_VideoController | Select-Object Name, @{Name="VRAM_GB"; Expression={
              if ($_.AdapterRAM) {
                [math]::Round($_.AdapterRAM / 1GB, 2)
              } else { "Unknown" }
          }} | Format-Table -AutoSize

          Write-Host "`n=========================================="
          Write-Host "       HARDWARE REPORT COMPLETE"
          Write-Host "       Report Generated By: Irfan Ali"
          Write-Host "=========================================="
